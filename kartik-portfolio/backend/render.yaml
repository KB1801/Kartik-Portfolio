# Render.com deployment blueprint (optional — you can also create the service in the dashboard)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kartik-portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set this in Render dashboard → Environment
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
